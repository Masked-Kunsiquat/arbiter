version: "2"

run:
  concurrency: 4
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 50

linters:
  enable:
    # correctness
    - govet
    - staticcheck # includes unused, gosimple, stylecheck in v2
    - errcheck
    - errorlint
    - nilerr
    - forcetypeassert
    - copyloopvar
    - durationcheck
    - reassign
    # style
    - gocritic
    - revive
    - whitespace
    - godot
    - misspell
    - dupword
    - predeclared
    - errname
    - asciicheck
    # complexity
    - gocyclo
    - nestif
    - funlen
    - dupl
    # performance
    - perfsprint
    - unconvert
    - ineffassign
    - goconst
    # security & resources
    - gosec
    - bidichk
    - bodyclose
    - noctx
    - fatcontext
    - sqlclosecheck
    - rowserrcheck
    # testing
    - testifylint
    - thelper
    - usetesting
    # modernization & meta
    - intrange
    - usestdlibvars
    - nolintlint

  disable:
    # paralleltest: none of the existing tests use t.Parallel(); add later intentionally
    - paralleltest
    # too strict / noisy defaults
    - lll
    - prealloc
    - wrapcheck
    - err113
    - mnd
    - nakedret
    - gocognit
    - cyclop
    - exhaustive
    - exhaustruct
    - gochecknoglobals
    - gochecknoinits
    - unparam
    - varnamelen

  exclusions:
    paths:
      - vendor$
      - agent/

  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 120
      statements: 80
    goconst:
      min-len: 3
      min-occurrences: 4
    gocyclo:
      min-complexity: 13
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - agent/

version: "2"

run:
  concurrency: 4
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 50

linters:
  enable:
    # correctness
    - govet
    - staticcheck # includes unused, gosimple, stylecheck in v2
    - errcheck
    - errorlint
    - nilerr
    - forcetypeassert
    - copyloopvar
    - durationcheck
    - reassign
    # style
    - gocritic
    - revive
    - whitespace
    - godot
    - misspell
    - dupword
    - predeclared
    - errname
    - asciicheck
    # complexity
    - nestif
    - funlen
    - dupl
    # performance
    - perfsprint
    - unconvert
    - ineffassign
    # security & resources
    - bidichk
    - bodyclose
    - noctx
    - fatcontext
    - sqlclosecheck
    - rowserrcheck
    # testing
    - testifylint
    - thelper
    - usetesting
    # modernization & meta
    - intrange
    - usestdlibvars
    - nolintlint

  disable:
    - gosec # noisy for local CLI file operations
    - gocyclo # high-branch switch/reflection statements are expected
    - goconst # repeated schema keys are clearer as literals
    # paralleltest: none of the existing tests use t.Parallel(); add later intentionally
    - paralleltest
    # too strict / noisy defaults
    - lll
    - prealloc
    - wrapcheck
    - err113
    - mnd
    - nakedret
    - gocognit
    - cyclop
    - exhaustive
    - exhaustruct
    - gochecknoglobals
    - gochecknoinits
    - unparam
    - varnamelen

  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    paths:
      - vendor$
      - agent/
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - revive
          - goconst
          - funlen
          - dupl
          - gocyclo
          - predeclared
          - forcetypeassert
          - noctx

  settings:
    dupl:
      threshold: 100
    funlen:
      lines: 120
      statements: 80
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - agent/



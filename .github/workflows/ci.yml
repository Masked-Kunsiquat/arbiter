name: CI

on:
  push:
    branches: ["main", "issue-*"]
  pull_request:
    branches: ["main"]

# Minimal permissions: read source, nothing else.
permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Test
        # Scope is ./cmd/... ./internal/... intentionally.
        # agent/skills/ contains reference snippets with external imports
        # that are not part of go.mod (they're documentation, not code).
        run: go test -race -count=1 ./cmd/... ./internal/...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true # golangci-lint-action manages its own cache

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./cmd/... ./internal/...
